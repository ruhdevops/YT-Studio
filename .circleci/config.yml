version: 2.1

jobs:
  python-checks:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: Install Python tools
          command: |
            pip install --user ruff mypy pytest pytest-cov
            echo 'export PATH="$HOME/.local/bin:$PATH"' >> $BASH_ENV
      - run:
          name: Run Ruff linter and formatter
          command: |
            ruff check . --fix
            ruff format .
      - run:
          name: Run MyPy type checker
          command: mypy . || echo "MyPy found issues but continuing"
      - run:
          name: Run pytest
          command: pytest || echo "No tests found"

  node-checks:
    docker:
      - image: cimg/node:20.18
    steps:
      - checkout
      - run:
          name: Install pnpm and root dependencies
          command: |
            sudo npm install -g pnpm
            pnpm install --frozen-lockfile
      - run:
          name: Install functions dependencies
          command: |
            cd functions
            npm install --legacy-peer-deps
      - run:
          name: Run ESLint on functions
          command: |
            cd functions
            npm run lint -- --max-warnings 0 || echo "Lint warnings found"
      - run:
          name: TypeScript type check (functions)
          command: |
            cd functions
            node_modules/.bin/tsc --noEmit || echo "Type errors found in functions"
      - run:
          name: Quality GC check
          command: pnpm run enhance || echo "Enhance step not applicable"

  worker-checks:
    docker:
      - image: cimg/node:20.18
    steps:
      - checkout
      - run:
          name: Install worker dependencies
          command: |
            cd app
            npm install
            npm install @cloudflare/workers-types@"^4.20250408.0" --legacy-peer-deps
      - run:
          name: TypeScript type check (Cloudflare Worker)
          command: |
            cd app
            node_modules/.bin/tsc --noEmit
      - run:
          name: Run worker tests
          command: |
            cd app
            npm test -- --run

  worker-deploy:
    docker:
      - image: cimg/node:20.18
    steps:
      - checkout
      - run:
          name: Install worker dependencies
          command: |
            cd app
            npm install
      - run:
          name: Generate Cloudflare Worker types
          command: |
            cd app
            node_modules/.bin/wrangler types
      - run:
          name: Deploy Cloudflare Worker (ytstudio)
          command: |
            cd app
            node_modules/.bin/wrangler deploy
          environment:
            CLOUDFLARE_API_TOKEN: $CLOUDFLARE_API_TOKEN
            CLOUDFLARE_ACCOUNT_ID: $CLOUDFLARE_ACCOUNT_ID

workflows:
  version: 2
  validate:
    jobs:
      - python-checks
      - node-checks
      - worker-checks
      - worker-deploy:
          requires:
            - worker-checks
          filters:
            branches:
              only: main
