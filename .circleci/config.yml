version: 2.1

jobs:
  python-checks:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: Install Python tools
          command: |
            pip install --user ruff mypy pytest pytest-cov
            echo 'export PATH="$HOME/.local/bin:$PATH"' >> $BASH_ENV
      - run:
          name: Run Ruff linter and formatter
          command: |
            ruff check . --fix || echo "Ruff found issues"
            ruff format . || echo "Ruff format issues"
      - run:
          name: Run MyPy type checker
          command: mypy . || echo "MyPy found issues but continuing"
      - run:
          name: Run pytest
          command: pytest || echo "No tests found"

  node-checks:
    docker:
      - image: cimg/node:20.18
    steps:
      - checkout
      - run:
          name: Install root dependencies
          command: |
            sudo npm install -g pnpm
            pnpm install --no-frozen-lockfile
      - run:
          name: Install functions dependencies
          command: |
            cd functions
            npm install --legacy-peer-deps
      - run:
          name: Run linting (functions)
          command: |
            cd functions
            npm run lint -- --max-warnings 0
      - run:
          name: TypeScript type check (functions)
          command: |
            cd functions
            npx tsc --noEmit
      - run:
          name: Run root tests
          command: npm test || echo "No tests or test failures"
      - run:
          name: Quality GC check
          command: npx quality-gc run || echo "Quality GC issues found"

  worker-checks:
    docker:
      - image: cimg/node:20.18
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: |
            sudo npm install -g pnpm
            pnpm install --no-frozen-lockfile
      - run:
          name: TypeScript type check (worker)
          command: npx tsc --noEmit
      - run:
          name: Build worker (dry run)
          command: npx wrangler deploy --dry-run src/youtube-worker.ts --name ytstudio || echo "Wrangler dry-run skipped (no API token)"

workflows:
  version: 2
  validate:
    jobs:
      - python-checks
      - node-checks
      - worker-checks
