version: 2.1

jobs:
  python-checks:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: Install Python tools
          command: |
            pip install --user ruff mypy pytest pytest-cov
            echo 'export PATH="$HOME/.local/bin:$PATH"' >> $BASH_ENV
      - run:
          name: Run Ruff linter and formatter
          command: |
            ruff check . --fix
            ruff format .
      - run:
          name: Run MyPy type checker
          command: mypy . || echo "MyPy found issues but continuing"
      - run:
          name: Run pytest
          command: pytest || echo "No tests found"

  node-checks:
    docker:
      - image: cimg/node:20.18
    steps:
      - checkout
      - run:
          name: Install pnpm
          command: sudo npm install -g pnpm
      - run:
          name: Install root dependencies
          command: pnpm install --frozen-lockfile
      - run:
          name: Install functions dependencies
          command: |
            cd functions
            npm install --legacy-peer-deps || echo "Functions install had issues, continuing"
      - run:
          name: Run functions linting
          command: |
            cd functions
            npm run lint -- --max-warnings 0 || echo "Functions lint issues found, continuing"
      - run:
          name: Functions TypeScript type check
          command: |
            cd functions
            npx tsc --noEmit || echo "Functions type check issues found, continuing"
      - run:
          name: Quality GC check
          command: npx quality-gc run || echo "Quality GC issues found"

  worker-checks:
    docker:
      - image: cimg/node:20.18
    steps:
      - checkout
      - run:
          name: Install pnpm
          command: sudo npm install -g pnpm
      - run:
          name: Install worker dependencies
          command: |
            cd app
            npm install
      - run:
          name: TypeScript type check (worker)
          command: |
            cd app
            npx tsc --noEmit
      - run:
          name: Run worker tests
          command: |
            cd app
            npm test -- --run

  worker-deploy:
    docker:
      - image: cimg/node:20.18
    steps:
      - checkout
      - run:
          name: Install pnpm
          command: sudo npm install -g pnpm
      - run:
          name: Install worker dependencies
          command: |
            cd app
            npm install
      - run:
          name: Deploy Cloudflare Worker
          command: |
            cd app
            npx wrangler deploy --name ytstudio
          environment:
            CLOUDFLARE_API_TOKEN: $CLOUDFLARE_API_TOKEN

workflows:
  version: 2
  validate:
    jobs:
      - python-checks
      - node-checks
      - worker-checks
      - worker-deploy:
          requires:
            - worker-checks
          filters:
            branches:
              only: main
