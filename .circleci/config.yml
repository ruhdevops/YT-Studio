version: 2.1

# ── Reusable commands ────────────────────────────────────────────────────────

commands:
  setup-pnpm:
    description: "Install pnpm and project root dependencies"
    steps:
      - run:
          name: Install pnpm
          command: sudo npm install -g pnpm
      - run:
          name: Install root dependencies
          command: pnpm install --frozen-lockfile

  setup-functions:
    description: "Install Firebase Functions dependencies"
    steps:
      - run:
          name: Install functions dependencies
          command: npm install --prefix functions --legacy-peer-deps

  setup-firebase:
    description: "Install Firebase CLI"
    steps:
      - run:
          name: Install Firebase CLI
          command: sudo npm install -g firebase-tools

  setup-wrangler:
    description: "Install Wrangler CLI for Cloudflare Workers"
    steps:
      - run:
          name: Install Wrangler
          command: sudo npm install -g wrangler

  persist-workspace:
    description: "Save build artifacts for later jobs"
    steps:
      - persist_to_workspace:
          root: ~/project
          paths:
            - functions/lib
            - public
            - .firebase
            - package.json

  attach-workspace:
    description: "Restore build artifacts"
    steps:
      - attach_workspace:
          at: ~/project

# ── Jobs ─────────────────────────────────────────────────────────────────────

jobs:
  python-checks:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: Install Python tools
          command: |
            pip install --user ruff mypy pytest pytest-cov
            echo 'export PATH="$HOME/.local/bin:$PATH"' >> $BASH_ENV
      - run:
          name: Run Ruff linter and formatter
          command: |
            ruff check . --fix || true
            ruff format . || true
      - run:
          name: Run MyPy type checker
          command: mypy . || true
      - run:
          name: Run pytest
          command: pytest || true

  node-checks:
    docker:
      - image: cimg/node:20.18
    steps:
      - checkout
      - setup-pnpm
      - setup-functions
      - run:
          name: Run ESLint on Firebase Functions
          command: |
            cd functions
            npm run lint -- --max-warnings 0
      - run:
          name: TypeScript type check (Firebase Functions)
          command: |
            cd functions
            ./node_modules/.bin/tsc --noEmit
      - run:
          name: TypeScript type check (Cloudflare Worker)
          command: pnpm run type-check || true

  build-functions:
    docker:
      - image: cimg/node:20.18
    steps:
      - checkout
      - setup-functions
      - run:
          name: Build Firebase Functions
          command: |
            cd functions
            npm run build
      - run:
          name: List built artifacts
          command: ls -la functions/lib/
      - persist-workspace

  deploy-worker:
    docker:
      - image: cimg/node:20.18
    steps:
      - checkout
      - setup-pnpm
      - setup-wrangler
      - run:
          name: Deploy YouTube API v3 Worker to Cloudflare
          command: |
            wrangler deploy src/youtube-worker.ts \
              --name ytstudio \
              --compatibility-date 2025-01-01 \
              --compatibility-flags nodejs_compat

  deploy-firebase:
    docker:
      - image: cimg/node:20.18
    steps:
      - checkout
      - setup-pnpm
      - setup-functions
      - setup-firebase
      - attach-workspace
      - run:
          name: Build site
          command: pnpm run build
      - run:
          name: Deploy to Firebase (Functions + Hosting)
          command: |
            firebase deploy --only functions,hosting --non-interactive --force

  deploy-preview:
    docker:
      - image: cimg/node:20.18
    steps:
      - checkout
      - setup-pnpm
      - setup-firebase
      - run:
          name: Build site
          command: pnpm run build
      - run:
          name: Deploy to Firebase Preview Channel
          command: |
            CHANNEL_NAME=$(echo "$CIRCLE_BRANCH" | tr '/' '-' | tr '[:upper:]' '[:lower:]' | cut -c1-20)
            firebase hosting:channel:deploy "$CHANNEL_NAME" --expires 7d --only hosting
            echo "Preview URL: https://${CHANNEL_NAME}--ytstudio-pr.web.app"

# ── Workflows ─────────────────────────────────────────────────────────────────

workflows:
  version: 2

  # Run on every push — lint, type-check, build
  validate:
    jobs:
      - python-checks
      - node-checks
      - build-functions:
          requires:
            - node-checks

  # Deploy worker + preview on feature branches
  ci:
    jobs:
      - node-checks:
          filters:
            branches:
              ignore: main
      - build-functions:
          requires:
            - node-checks
          filters:
            branches:
              ignore: main
      - deploy-worker:
          requires:
            - node-checks
          filters:
            branches:
              ignore: main
      - deploy-preview:
          requires:
            - build-functions
          filters:
            branches:
              ignore: main

  # Full production deploy on main
  cd:
    jobs:
      - node-checks:
          filters:
            branches:
              only: main
      - build-functions:
          requires:
            - node-checks
          filters:
            branches:
              only: main
      - deploy-worker:
          requires:
            - node-checks
          filters:
            branches:
              only: main
      - deploy-firebase:
          requires:
            - build-functions
          filters:
            branches:
              only: main
