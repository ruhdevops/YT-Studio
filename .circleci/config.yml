version: 2.1

jobs:
  python-checks:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: Install Python tools
          command: |
            pip install --user ruff mypy pytest pytest-cov
            echo 'export PATH="$HOME/.local/bin:$PATH"' >> $BASH_ENV
      - run:
          name: Run Ruff linter and formatter
          command: |
            ruff check . --fix
            ruff format .
      - run:
          name: Run MyPy type checker
          command: mypy . || echo "MyPy found issues but continuing"
      - run:
          name: Run pytest
          command: pytest || echo "No tests found"

  node-checks:
    docker:
      - image: cimg/node:22.19
    steps:
      - checkout
      - run:
          name: Install pnpm
          command: sudo npm install -g pnpm
      - run:
          name: Install root dependencies
          command: pnpm install --frozen-lockfile
      - run:
          name: Install functions dependencies
          command: |
            cd functions
            npm install --legacy-peer-deps
      - run:
          name: Run ESLint on functions
          command: |
            cd functions
            npm run lint -- --max-warnings 0
      - run:
          name: TypeScript type check on functions
          command: |
            cd functions
            ./node_modules/.bin/tsc --noEmit

  worker-checks:
    docker:
      - image: cimg/node:22.19
    steps:
      - checkout
      - run:
          name: Install pnpm
          command: sudo npm install -g pnpm
      - run:
          name: Install app dependencies
          command: |
            cd app
            npm install
      - run:
          name: TypeScript type check on worker
          command: |
            cd app
            ./node_modules/.bin/tsc --noEmit
      - run:
          name: Run worker tests
          command: |
            cd app
            npm test -- --run

  deploy-worker:
    docker:
      - image: cimg/node:22.19
    steps:
      - checkout
      - run:
          name: Install pnpm
          command: sudo npm install -g pnpm
      - run:
          name: Install app dependencies
          command: |
            cd app
            npm install
      - run:
          name: Deploy yt-proxy worker to Cloudflare
          command: |
            cd app
            ./node_modules/.bin/wrangler deploy --env production
          environment:
            CLOUDFLARE_API_TOKEN: $CLOUDFLARE_API_TOKEN
            CLOUDFLARE_ACCOUNT_ID: $CLOUDFLARE_ACCOUNT_ID
      - run:
          name: Install root dependencies for ytstudio worker
          command: pnpm install --frozen-lockfile
      - run:
          name: Deploy ytstudio worker to Cloudflare
          command: |
            ./node_modules/.bin/wrangler deploy src/youtube-worker.ts --name ytstudio
          environment:
            CLOUDFLARE_API_TOKEN: $CLOUDFLARE_API_TOKEN
            CLOUDFLARE_ACCOUNT_ID: $CLOUDFLARE_ACCOUNT_ID

workflows:
  version: 2
  validate:
    jobs:
      - python-checks
      - node-checks
      - worker-checks

  deploy:
    jobs:
      - node-checks:
          filters:
            branches:
              only: main
      - worker-checks:
          filters:
            branches:
              only: main
      - deploy-worker:
          requires:
            - node-checks
            - worker-checks
          filters:
            branches:
              only: main
