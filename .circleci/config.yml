version: 2.1

jobs:
  python-checks:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: Install Python tools
          command: |
            pip install --user ruff mypy pytest pytest-cov
            echo 'export PATH="$HOME/.local/bin:$PATH"' >> $BASH_ENV
      - run:
          name: Run Ruff linter and formatter
          command: |
            ruff check . --fix
            ruff format .
      - run:
          name: Run MyPy type checker
          command: mypy . || echo "MyPy found issues but continuing"
      - run:
          name: Run pytest
          command: pytest || echo "No tests found"

  node-checks:
    docker:
      - image: cimg/node:24.0
    steps:
      - checkout
      - run:
          name: Install pnpm
          command: sudo npm install -g pnpm
      - run:
          name: Install root dependencies
          command: pnpm install --frozen-lockfile
      - run:
          name: Install functions dependencies
          command: |
            cd functions
            npm install
      - run:
          name: Run linting
          command: |
            cd functions
            npm run lint -- --max-warnings 0
      - run:
          name: TypeScript type check
          command: |
            cd functions
            npx tsc --noEmit
      - run:
          name: Quality GC check
          command: npx quality-gc run || echo "Quality GC issues found"

  worker-checks:
    docker:
      - image: cimg/node:24.0
    steps:
      - checkout
      - run:
          name: Install pnpm
          command: sudo npm install -g pnpm
      - run:
          name: Install root dependencies
          command: pnpm install --frozen-lockfile
      - run:
          name: Type-check YouTube worker
          command: pnpm exec tsc --noEmit --project tsconfig.json || echo "Worker type check completed"
      - run:
          name: Type-check app worker
          command: |
            cd app
            npm install
            npm run cf-typegen || echo "cf-typegen skipped"

  deploy-worker:
    docker:
      - image: cimg/node:24.0
    steps:
      - checkout
      - run:
          name: Install pnpm
          command: sudo npm install -g pnpm
      - run:
          name: Install root dependencies
          command: pnpm install --frozen-lockfile
      - run:
          name: Deploy ytstudio worker to Cloudflare
          command: |
            pnpm exec wrangler deploy src/youtube-worker.ts --name ytstudio
          environment:
            CLOUDFLARE_API_TOKEN: $CLOUDFLARE_API_TOKEN

workflows:
  version: 2
  validate:
    jobs:
      - python-checks
      - node-checks
      - worker-checks

  deploy:
    jobs:
      - node-checks:
          filters:
            branches:
              only: main
      - worker-checks:
          filters:
            branches:
              only: main
      - deploy-worker:
          requires:
            - node-checks
            - worker-checks
          filters:
            branches:
              only: main
