version: 2.1

jobs:
  python-checks:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: Install Python tools
          command: |
            pip install --user ruff mypy pytest pytest-cov
            echo 'export PATH="$HOME/.local/bin:$PATH"' >> $BASH_ENV
      - run:
          name: Run Ruff linter and formatter
          command: |
            ruff check . --fix
            ruff format .
      - run:
          name: Run MyPy type checker
          command: mypy . || echo "MyPy found issues but continuing"
      - run:
          name: Run pytest
          command: pytest || echo "No tests found"

  node-checks:
    docker:
      - image: cimg/node:24.18
    steps:
      - checkout
      - run:
          name: Install pnpm and root dependencies
          command: |
            sudo npm install -g pnpm
            pnpm install --frozen-lockfile
      - run:
          name: Install Firebase Functions dependencies
          command: |
            cd functions
            npm install
      - run:
          name: Run Firebase Functions linting
          command: |
            cd functions
            npm run lint -- --max-warnings 0
      - run:
          name: Firebase Functions TypeScript type check
          command: |
            cd functions
            ./node_modules/.bin/tsc --noEmit
      - run:
          name: Run App worker TypeScript type check
          command: |
            cd app
            npm install
            ./node_modules/.bin/tsc --noEmit
      - run:
          name: Quality GC check
          command: ./node_modules/.bin/quality-gc run || echo "Quality GC issues found"

  deploy-worker:
    docker:
      - image: cimg/node:24.18
    steps:
      - checkout
      - run:
          name: Install pnpm and dependencies
          command: |
            sudo npm install -g pnpm
            pnpm install --frozen-lockfile
      - run:
          name: Deploy YouTube API Worker to Cloudflare
          command: |
            if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
              echo "CLOUDFLARE_API_TOKEN not set - skipping worker deployment"
              exit 0
            fi
            ./node_modules/.bin/wrangler deploy src/youtube-worker.ts --name ytstudio --env production
          environment:
            CLOUDFLARE_API_TOKEN: $CLOUDFLARE_API_TOKEN
            CLOUDFLARE_ACCOUNT_ID: $CLOUDFLARE_ACCOUNT_ID
      - run:
          name: Deploy App Worker to Cloudflare
          command: |
            if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
              echo "CLOUDFLARE_API_TOKEN not set - skipping app worker deployment"
              exit 0
            fi
            cd app
            npm install
            ./node_modules/.bin/wrangler deploy
          environment:
            CLOUDFLARE_API_TOKEN: $CLOUDFLARE_API_TOKEN
            CLOUDFLARE_ACCOUNT_ID: $CLOUDFLARE_ACCOUNT_ID

workflows:
  version: 2
  validate:
    jobs:
      - python-checks
      - node-checks
      - deploy-worker:
          requires:
            - node-checks
          filters:
            branches:
              only: main
