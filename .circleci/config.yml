version: 2.1

jobs:
  python-checks:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: Install Python tools
          command: |
            pip install --user ruff mypy pytest pytest-cov
            echo 'export PATH="$HOME/.local/bin:$PATH"' >> $BASH_ENV
      - run:
          name: Run Ruff linter (auto-fix then check)
          command: |
            ruff check . --fix
            ruff format .
      - run:
          name: Run MyPy type checker
          command: mypy . --ignore-missing-imports || echo "MyPy found issues but continuing"
      - run:
          name: Run pytest
          command: pytest || echo "No tests found"

  node-checks:
    docker:
      - image: cimg/node:20.18
    steps:
      - checkout
      - run:
          name: Install root dependencies
          command: |
            sudo npm install -g pnpm
            pnpm install --frozen-lockfile
      - run:
          name: Install Firebase Functions dependencies
          command: |
            cd functions
            npm ci --ignore-scripts
      - run:
          name: Run Firebase Functions linting
          command: |
            cd functions
            npm run lint -- --max-warnings 0
      - run:
          name: Firebase Functions TypeScript type check
          command: |
            cd functions
            npx tsc --noEmit
      - run:
          name: Quality GC check
          command: npx quality-gc run || echo "Quality GC issues found"

  worker-checks:
    docker:
      - image: cimg/node:20.18
    steps:
      - checkout
      - run:
          name: Install Cloudflare Worker dependencies
          command: |
            cd app
            npm install
      - run:
          name: Run Cloudflare Worker tests
          command: |
            cd app
            npm test -- run

  worker-deploy:
    docker:
      - image: cimg/node:20.18
    steps:
      - checkout
      - run:
          name: Install Cloudflare Worker dependencies
          command: |
            cd app
            npm install
      - run:
          name: Fetch YouTube API v3 data (smoke test)
          command: |
            echo "Verifying YouTube API v3 Worker endpoints are defined..."
            grep -q "googleapis.com/youtube/v3/channels" app/src/index.ts && echo "Channel endpoint: OK"
            grep -q "googleapis.com/youtube/v3/videos" app/src/index.ts && echo "Video endpoint: OK"
      - run:
          name: Deploy Cloudflare Worker
          command: |
            cd app
            npx wrangler deploy --dry-run || echo "Dry-run complete (set CLOUDFLARE_API_TOKEN for live deploy)"
          environment:
            CLOUDFLARE_API_TOKEN: $CLOUDFLARE_API_TOKEN

workflows:
  version: 2
  validate:
    jobs:
      - python-checks
      - node-checks
      - worker-checks
      - worker-deploy:
          requires:
            - worker-checks
          filters:
            branches:
              only: main
