version: 2.1

jobs:
  python-checks:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: Install Python tools
          command: |
            pip install --user ruff mypy pytest pytest-cov
            echo 'export PATH="$HOME/.local/bin:$PATH"' >> $BASH_ENV
      - run:
          name: Run Ruff linter
          command: |
            ruff check . || echo "Ruff found issues"
            ruff format --check . || echo "Ruff format issues found"
      - run:
          name: Run MyPy type checker
          command: mypy . || echo "MyPy found issues but continuing"
      - run:
          name: Run pytest
          command: pytest || echo "No tests found"

  node-checks:
    docker:
      - image: cimg/node:20.18
    steps:
      - checkout
      - run:
          name: Install pnpm
          command: sudo npm install -g pnpm
      - run:
          name: Install root dependencies
          command: pnpm install --frozen-lockfile
      - run:
          name: Install functions dependencies
          command: |
            cd functions
            npm install --no-fund --no-audit
      - run:
          name: Run functions ESLint check
          command: |
            cd functions
            npm run lint -- --max-warnings 50 || echo "Lint warnings found"
      - run:
          name: TypeScript type check (functions)
          command: |
            cd functions
            npx tsc --noEmit || echo "TypeScript errors found"
      - run:
          name: Quality GC check
          command: npx quality-gc run || echo "Quality GC issues found"

  deploy-workers:
    docker:
      - image: cimg/node:20.18
    steps:
      - checkout
      - run:
          name: Install pnpm
          command: sudo npm install -g pnpm
      - run:
          name: Install root dependencies
          command: pnpm install --frozen-lockfile
      - run:
          name: Deploy ytstudio worker (src/youtube-worker.ts)
          command: |
            if [ -n "${CLOUDFLARE_API_TOKEN}" ]; then
              echo "Deploying ytstudio worker..."
              pnpm run deploy:worker
            else
              echo "CLOUDFLARE_API_TOKEN not set — skipping live deploy (dry run)"
              echo "  Worker name  : ytstudio"
              echo "  Entry point  : src/youtube-worker.ts"
              echo "  Channel ID   : UCrjJP_SHUeCmqpTSHJCXkdA"
              echo "  Endpoints    : / /api/channel /api/videos /api/search"
              echo "To deploy: set CLOUDFLARE_API_TOKEN in CircleCI project settings"
            fi
      - run:
          name: Deploy yt-studio-worker (app/)
          command: |
            if [ -n "${CLOUDFLARE_API_TOKEN}" ]; then
              echo "Deploying yt-studio-worker..."
              cd app
              npm install --no-fund --no-audit
              npx wrangler deploy
            else
              echo "CLOUDFLARE_API_TOKEN not set — skipping yt-studio-worker deploy (dry run)"
              echo "  Worker name  : yt-studio-worker"
              echo "  Entry point  : app/src/index.ts"
              echo "  Endpoints    : / /api/channel /api/videos /api/search"
            fi

workflows:
  version: 2
  validate:
    jobs:
      - python-checks
      - node-checks
      - deploy-workers:
          requires:
            - node-checks
