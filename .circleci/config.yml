version: 2.1

jobs:
  python-checks:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: Install Python tools
          command: |
            pip install --user ruff mypy pytest pytest-cov
            echo 'export PATH="$HOME/.local/bin:$PATH"' >> $BASH_ENV
      - run:
          name: Run Ruff linter and formatter
          command: |
            ruff check . --fix
            ruff format .
      - run:
          name: Run MyPy type checker
          command: mypy . || echo "MyPy found issues but continuing"
      - run:
          name: Run pytest
          command: pytest || echo "No tests found"

  node-checks:
    docker:
      - image: cimg/node:20.18
    steps:
      - checkout
      - run:
          name: Install root dependencies
          command: |
            npm install -g pnpm
            pnpm install --frozen-lockfile
      - run:
          name: Install functions dependencies
          command: |
            cd functions
            npm install --no-fund --no-audit
      - run:
          name: Run linting
          command: |
            cd functions
            npm run lint -- --max-warnings 0
      - run:
          name: TypeScript type check
          command: |
            cd functions
            ./node_modules/.bin/tsc --noEmit

  worker-test:
    docker:
      - image: cimg/node:20.18
    steps:
      - checkout
      - run:
          name: Install app dependencies
          command: |
            cd app
            npm install --no-fund --no-audit
      - run:
          name: Run YouTube API worker tests
          command: |
            cd app
            npm test -- --run

  worker-deploy:
    docker:
      - image: cimg/node:20.18
    steps:
      - checkout
      - run:
          name: Install app dependencies
          command: |
            cd app
            npm install --no-fund --no-audit
      - run:
          name: Deploy YouTube API proxy worker to Cloudflare
          command: |
            cd app
            ./node_modules/.bin/wrangler deploy \
              --name ytstudio-proxy \
              --compatibility-date 2025-01-01
          environment:
            CLOUDFLARE_API_TOKEN: $CLOUDFLARE_API_TOKEN
            CLOUDFLARE_ACCOUNT_ID: $CLOUDFLARE_ACCOUNT_ID

workflows:
  version: 2
  validate:
    jobs:
      - python-checks
      - node-checks
      - worker-test
  deploy:
    jobs:
      - worker-test:
          filters:
            branches:
              only: main
      - worker-deploy:
          requires:
            - worker-test
          filters:
            branches:
              only: main
