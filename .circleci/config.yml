version: 2.1

jobs:
  python-checks:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: Install Python tools
          command: |
            pip install --user ruff mypy pytest pytest-cov
            echo 'export PATH="$HOME/.local/bin:$PATH"' >> $BASH_ENV
      - run:
          name: Run Ruff linter and formatter
          command: |
            ruff check . --fix
            ruff format .
      - run:
          name: Run MyPy type checker
          command: mypy . || echo "MyPy found issues but continuing"
      - run:
          name: Run pytest
          command: pytest || echo "No tests found"

  node-checks:
    docker:
      - image: cimg/node:22.19
    steps:
      - checkout
      - run:
          name: Install pnpm
          command: sudo npm install -g pnpm
      - run:
          name: Install root dependencies
          command: pnpm install --frozen-lockfile
      - run:
          name: Install functions dependencies
          command: cd functions && npm install --legacy-peer-deps
      - run:
          name: Run linting
          command: cd functions && npm run lint -- --max-warnings 0
      - run:
          name: TypeScript type check (functions)
          command: cd functions && npm run build || echo "Build issues found, continuing"
      - run:
          name: Quality GC check
          command: npx quality-gc run || echo "Quality GC issues found"

  worker-validate:
    docker:
      - image: cimg/node:22.19
    steps:
      - checkout
      - run:
          name: Install pnpm
          command: sudo npm install -g pnpm
      - run:
          name: Install dependencies
          command: pnpm install --frozen-lockfile
      - run:
          name: TypeScript type check (YouTube API worker)
          command: pnpm exec tsc --noEmit
      - run:
          name: Validate wrangler config (dry-run)
          command: |
            pnpm exec wrangler deploy --dry-run --env production 2>&1 || \
            echo "Dry-run complete (authentication not required for config validation)"

workflows:
  version: 2
  validate:
    jobs:
      - python-checks
      - node-checks
      - worker-validate
