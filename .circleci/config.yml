version: 2.1

jobs:
  python-checks:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: Install Python tools
          command: |
            pip install --user ruff mypy pytest pytest-cov
            echo 'export PATH="$HOME/.local/bin:$PATH"' >> $BASH_ENV
      - run:
          name: Run Ruff linter and formatter
          command: |
            ruff check . --fix
            ruff format .
      - run:
          name: Run MyPy type checker
          command: mypy . || echo "MyPy found issues but continuing"
      - run:
          name: Run pytest
          command: pytest || echo "No tests found"

  node-checks:
    docker:
      - image: cimg/node:20.18
    steps:
      - checkout
      - run:
          name: Install global tools
          command: sudo npm install -g pnpm
      - run:
          name: Install root dependencies
          command: pnpm install --frozen-lockfile
      - run:
          name: Install Functions dependencies
          command: |
            cd functions
            npm install --legacy-peer-deps
      - run:
          name: Run Functions linting
          command: |
            cd functions
            npm run lint -- --max-warnings 0
      - run:
          name: Build Functions TypeScript
          command: |
            cd functions
            npm run build
      - run:
          name: Quality GC check
          command: pnpm exec quality-gc run || echo "Quality GC issues found"

  worker-deploy:
    docker:
      - image: cimg/node:20.18
    steps:
      - checkout
      - run:
          name: Install global tools
          command: sudo npm install -g pnpm
      - run:
          name: Install root dependencies
          command: pnpm install --frozen-lockfile
      - run:
          name: Type-check YouTube worker
          command: pnpm exec tsc --noEmit --project tsconfig.json
      - run:
          name: Deploy ytstudio worker (YouTube API v3)
          command: pnpm exec wrangler deploy src/youtube-worker.ts --name ytstudio
          environment:
            CLOUDFLARE_API_TOKEN: $CLOUDFLARE_API_TOKEN
            CLOUDFLARE_ACCOUNT_ID: $CLOUDFLARE_ACCOUNT_ID
      - run:
          name: Install app worker dependencies
          command: |
            cd app
            npm install
      - run:
          name: Deploy ytstudio-app worker
          command: |
            cd app
            npm run deploy
          environment:
            CLOUDFLARE_API_TOKEN: $CLOUDFLARE_API_TOKEN
            CLOUDFLARE_ACCOUNT_ID: $CLOUDFLARE_ACCOUNT_ID

workflows:
  version: 2
  validate:
    jobs:
      - python-checks
      - node-checks
  deploy-workers:
    jobs:
      - worker-deploy:
          filters:
            branches:
              only: main
