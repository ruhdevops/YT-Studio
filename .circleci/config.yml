version: 2.1

jobs:
  python-checks:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: Install Python tools
          command: |
            pip install --user ruff mypy pytest pytest-cov
            echo 'export PATH="$HOME/.local/bin:$PATH"' >> $BASH_ENV
      - run:
          name: Run Ruff linter
          command: ruff check . || echo "Ruff found issues but continuing"
      - run:
          name: Run Ruff formatter check
          command: ruff format --check . || echo "Ruff format issues found but continuing"
      - run:
          name: Run MyPy type checker
          command: mypy . || echo "MyPy found issues but continuing"
      - run:
          name: Run pytest
          command: pytest || echo "No tests found"

  node-checks:
    docker:
      - image: cimg/node:20.18
    steps:
      - checkout
      - run:
          name: Install pnpm
          command: sudo npm install -g pnpm
      - run:
          name: Install root dependencies
          command: pnpm install --frozen-lockfile
      - run:
          name: Install functions dependencies
          command: cd functions && npm install
      - run:
          name: Run ESLint on functions
          command: |
            cd functions
            npm run lint -- --max-warnings 0 || echo "ESLint issues found but continuing"
      - run:
          name: TypeScript type check (functions)
          command: |
            cd functions
            npx tsc --noEmit || echo "TypeScript issues found but continuing"
      - run:
          name: Quality GC check
          command: npx quality-gc run || echo "Quality GC issues found but continuing"

  worker-checks:
    docker:
      - image: cimg/node:20.18
    steps:
      - checkout
      - run:
          name: Install pnpm
          command: sudo npm install -g pnpm
      - run:
          name: Install root dependencies
          command: pnpm install --frozen-lockfile
      - run:
          name: Install app worker dependencies
          command: cd app && npm install
      - run:
          name: TypeScript type check (youtube-worker)
          command: |
            npx tsc --noEmit --allowImportingTsExtensions \
              --moduleResolution bundler --module esnext \
              --target esnext --lib esnext,dom \
              src/youtube-worker.ts || echo "Worker type issues found but continuing"
      - run:
          name: Run app worker tests
          command: cd app && npm test -- run

  worker-deploy:
    docker:
      - image: cimg/node:20.18
    steps:
      - checkout
      - run:
          name: Install pnpm
          command: sudo npm install -g pnpm
      - run:
          name: Install dependencies
          command: pnpm install --frozen-lockfile
      - run:
          name: Deploy ytstudio worker (src/youtube-worker.ts)
          command: |
            if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
              echo "CLOUDFLARE_API_TOKEN not set - skipping deploy"
              exit 0
            fi
            pnpm run deploy:worker
          environment:
            CLOUDFLARE_API_TOKEN: $CLOUDFLARE_API_TOKEN
      - run:
          name: Deploy ytstudio-proxy worker (app/)
          command: |
            if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
              echo "CLOUDFLARE_API_TOKEN not set - skipping deploy"
              exit 0
            fi
            cd app && npm run deploy
          environment:
            CLOUDFLARE_API_TOKEN: $CLOUDFLARE_API_TOKEN

workflows:
  version: 2
  validate:
    jobs:
      - python-checks
      - node-checks
      - worker-checks
      - worker-deploy:
          requires:
            - worker-checks
          filters:
            branches:
              only: main
