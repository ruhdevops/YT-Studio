version: 2.1

jobs:
  python-checks:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: Install Python tools
          command: |
            pip install --user ruff mypy pytest pytest-cov
            echo 'export PATH="$HOME/.local/bin:$PATH"' >> $BASH_ENV
      - run:
          name: Run Ruff linter and formatter check
          command: |
            ruff check . || echo "Ruff found issues but continuing"
            ruff format --check . || echo "Ruff format issues found but continuing"
      - run:
          name: Run MyPy type checker
          command: mypy . || echo "MyPy found issues but continuing"
      - run:
          name: Run pytest
          command: pytest || echo "No tests found"

  node-checks:
    docker:
      - image: cimg/node:20.18
    steps:
      - checkout
      - run:
          name: Install pnpm and root dependencies
          command: |
            sudo npm install -g pnpm
            pnpm install --frozen-lockfile
      - run:
          name: Install functions dependencies
          command: |
            cd functions
            npm install
      - run:
          name: Run ESLint on functions
          command: |
            cd functions
            npm run lint || echo "ESLint issues found but continuing"
      - run:
          name: TypeScript type check on functions
          command: |
            cd functions
            npx tsc --noEmit || echo "TypeScript issues found but continuing"

  worker-checks:
    docker:
      - image: cimg/node:20.18
    steps:
      - checkout
      - run:
          name: Install app worker dependencies
          command: |
            cd app
            npm install
      - run:
          name: TypeScript type check on app worker
          command: |
            cd app
            npx tsc --noEmit || echo "TypeScript issues found but continuing"

workflows:
  version: 2
  validate:
    jobs:
      - python-checks
      - node-checks
      - worker-checks
