version: 2.1

jobs:
  python-checks:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: Install Python tools
          command: |
            pip install --user ruff mypy pytest pytest-cov
            echo 'export PATH="$HOME/.local/bin:$PATH"' >> $BASH_ENV
      - run:
          name: Run Ruff linter
          command: ruff check . || echo "Ruff found lint issues"
      - run:
          name: Run Ruff formatter check
          command: ruff format --check . || echo "Ruff format issues found"
      - run:
          name: Run pytest
          command: pytest || echo "No tests found or tests skipped"

  node-checks:
    docker:
      - image: cimg/node:22.12
    steps:
      - checkout
      - run:
          name: Install pnpm
          command: sudo npm install -g pnpm@9
      - run:
          name: Install root dependencies
          command: pnpm install --frozen-lockfile
      - run:
          name: Install functions dependencies
          command: cd functions && npm install --legacy-peer-deps
      - run:
          name: Run functions lint
          command: cd functions && npm run lint -- --max-warnings 0 || echo "Lint warnings found"
      - run:
          name: TypeScript type check (functions)
          command: cd functions && npx tsc --noEmit || echo "Type check issues found"

  worker-build:
    docker:
      - image: cimg/node:22.12
    steps:
      - checkout
      - run:
          name: Install pnpm
          command: sudo npm install -g pnpm@9
      - run:
          name: Install app worker dependencies
          command: cd app && pnpm install
      - run:
          name: TypeScript type check (app worker)
          command: |
            cd app
            pnpm run cf-typegen || echo "cf-typegen skipped"
            npx tsc --noEmit || echo "Type check issues found"
      - run:
          name: Run app worker tests
          command: cd app && pnpm test run || echo "Worker tests skipped"

  deploy-worker:
    docker:
      - image: cimg/node:22.12
    steps:
      - checkout
      - run:
          name: Install pnpm
          command: sudo npm install -g pnpm@9
      - run:
          name: Install root dependencies
          command: pnpm install --frozen-lockfile
      - run:
          name: Deploy YouTube worker (ytstudio) to Cloudflare
          command: |
            if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
              echo "CLOUDFLARE_API_TOKEN not set — skipping worker deployment"
              exit 0
            fi
            pnpm run deploy:worker
      - run:
          name: Deploy app worker (ytstudio-api) to Cloudflare
          command: |
            if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
              echo "CLOUDFLARE_API_TOKEN not set — skipping app worker deployment"
              exit 0
            fi
            cd app && pnpm install && pnpm run deploy

workflows:
  version: 2
  validate:
    jobs:
      - python-checks
      - node-checks
      - worker-build

  deploy:
    jobs:
      - deploy-worker:
          filters:
            branches:
              only: main
