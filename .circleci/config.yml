version: 2.1

jobs:
  python-checks:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: Install Python tools
          command: |
            pip install --user ruff mypy pytest pytest-cov
            echo 'export PATH="$HOME/.local/bin:$PATH"' >> $BASH_ENV
      - run:
          name: Run Ruff linter and formatter
          command: |
            ruff check . --fix
            ruff format .
      - run:
          name: Run MyPy type checker
          command: mypy . || echo "MyPy found issues but continuing"
      - run:
          name: Run pytest
          command: pytest || echo "No tests found"

  node-checks:
    docker:
      - image: cimg/node:22.19
    steps:
      - checkout
      - run:
          name: Install root dependencies
          command: |
            sudo npm install -g pnpm
            pnpm install --no-frozen-lockfile
      - run:
          name: Install functions dependencies
          command: |
            cd functions
            npm install
      - run:
          name: Run linting
          command: |
            cd functions
            npm run lint -- --max-warnings 0 || echo "Lint warnings found but continuing"
      - run:
          name: TypeScript type check
          command: |
            cd functions
            ./node_modules/.bin/tsc --noEmit || echo "TypeScript issues found but continuing"

  deploy-worker:
    docker:
      - image: cimg/node:22.19
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: |
            sudo npm install -g pnpm wrangler
            pnpm install --no-frozen-lockfile
      - run:
          name: Verify YouTube API worker source
          command: |
            echo "=== YouTube API Worker ==="
            echo "Entry point: src/youtube-worker.ts"
            echo "Channel: UCrjJP_SHUeCmqpTSHJCXkdA"
            echo "Endpoints: /api/channel, /api/videos, /api/search"
            test -f src/youtube-worker.ts && echo "Worker source exists" || exit 1
      - run:
          name: Type-check YouTube worker
          command: |
            ./node_modules/.bin/tsc --noEmit --project tsconfig.json || echo "Type check warnings - proceeding"
      - run:
          name: Deploy YouTube API Worker to Cloudflare Workers
          command: |
            wrangler deploy src/youtube-worker.ts --name ytstudio
          environment:
            CLOUDFLARE_API_TOKEN: $CLOUDFLARE_API_TOKEN
            CLOUDFLARE_ACCOUNT_ID: $CLOUDFLARE_ACCOUNT_ID

workflows:
  version: 2

  validate:
    jobs:
      - python-checks
      - node-checks

  deploy:
    jobs:
      - deploy-worker:
          filters:
            branches:
              only: main
