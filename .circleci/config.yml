version: 2.1

jobs:
  python-checks:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: Install Python tools
          command: |
            pip install --user ruff mypy pytest pytest-cov
            echo 'export PATH="$HOME/.local/bin:$PATH"' >> $BASH_ENV
      - run:
          name: Run Ruff linter and formatter
          command: |
            ruff check . --fix
            ruff format .
      - run:
          name: Run MyPy type checker
          command: mypy . || echo "MyPy found issues but continuing"
      - run:
          name: Run pytest
          command: pytest || echo "No tests found"

  node-checks:
    docker:
      - image: cimg/node:20.18
    steps:
      - checkout
      - run:
          name: Install pnpm and root dependencies
          command: |
            sudo npm install -g pnpm
            pnpm install --frozen-lockfile
      - run:
          name: Install functions dependencies
          command: |
            cd functions
            npm install --no-fund --no-audit
      - run:
          name: Run ESLint on functions
          command: |
            cd functions
            npm run lint -- --max-warnings 0
      - run:
          name: TypeScript type check for functions
          command: |
            cd functions
            npx tsc --noEmit
      - run:
          name: Quality GC check
          command: npx quality-gc run || echo "Quality GC issues found"

  worker-checks:
    docker:
      - image: cimg/node:22.19
    steps:
      - checkout
      - run:
          name: Install pnpm
          command: sudo npm install -g pnpm
      - run:
          name: Install app worker dependencies
          command: |
            cd app
            pnpm install
      - run:
          name: Run Cloudflare Worker tests
          command: |
            cd app
            pnpm test

workflows:
  version: 2
  validate:
    jobs:
      - python-checks
      - node-checks
      - worker-checks
