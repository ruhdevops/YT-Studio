version: 2.1

jobs:
  python-checks:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: Install Python tools
          command: |
            pip install --user ruff mypy pytest pytest-cov
            echo 'export PATH="$HOME/.local/bin:$PATH"' >> $BASH_ENV
      - run:
          name: Run Ruff linter
          command: ruff check .
      - run:
          name: Run Ruff formatter check
          command: ruff format --check .
      - run:
          name: Run MyPy type checker
          command: mypy . --ignore-missing-imports || echo "MyPy found issues but continuing"
      - run:
          name: Run pytest
          command: pytest || echo "No tests found"

  node-checks:
    docker:
      - image: cimg/node:20.18
    steps:
      - checkout
      - run:
          name: Install pnpm
          command: sudo npm install -g pnpm
      - run:
          name: Install root dependencies
          command: pnpm install --frozen-lockfile
      - run:
          name: Install functions dependencies
          command: cd functions && npm install
      - run:
          name: Run ESLint on functions
          command: |
            cd functions
            npm run lint -- --max-warnings 0
      - run:
          name: TypeScript type check
          command: |
            cd functions
            npx tsc --noEmit

  deploy-worker:
    docker:
      - image: cimg/node:20.18
    steps:
      - checkout
      - run:
          name: Install pnpm
          command: sudo npm install -g pnpm
      - run:
          name: Install dependencies
          command: pnpm install --frozen-lockfile
      - run:
          name: Deploy YouTube API v3 Worker to Cloudflare
          command: |
            echo "Deploying YouTube worker (src/youtube-worker.ts) to Cloudflare Workers..."
            pnpm run deploy:worker
          environment:
            CLOUDFLARE_API_TOKEN: $CLOUDFLARE_API_TOKEN
            CLOUDFLARE_ACCOUNT_ID: $CLOUDFLARE_ACCOUNT_ID

workflows:
  version: 2
  validate:
    jobs:
      - python-checks
      - node-checks
      - deploy-worker:
          requires:
            - node-checks
          filters:
            branches:
              only: main
