version: 2.1

jobs:
  python-checks:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: Install Python tools
          command: |
            pip install --user ruff mypy pytest pytest-cov
            echo 'export PATH="$HOME/.local/bin:$PATH"' >> $BASH_ENV
      - run:
          name: Run Ruff linter
          command: ruff check . || echo "Ruff found issues but continuing"
      - run:
          name: Run Ruff formatter check
          command: ruff format --check . || echo "Ruff format issues found but continuing"
      - run:
          name: Run MyPy type checker
          command: mypy . || echo "MyPy found issues but continuing"
      - run:
          name: Run pytest
          command: pytest || echo "No tests found"

  node-checks:
    docker:
      - image: cimg/node:22.19
    steps:
      - checkout
      - run:
          name: Install pnpm
          command: sudo npm install -g pnpm
      - run:
          name: Install root dependencies
          command: pnpm install --frozen-lockfile
      - run:
          name: TypeScript check (YouTube workers)
          command: ./node_modules/.bin/tsc --noEmit
      - run:
          name: Install Firebase Functions dependencies
          command: cd functions && npm install
      - run:
          name: Lint Firebase Functions
          command: cd functions && npm run lint -- --max-warnings 0
      - run:
          name: TypeScript check (Firebase functions)
          command: cd functions && ./node_modules/.bin/tsc --noEmit

  deploy-worker:
    docker:
      - image: cimg/node:22.19
    steps:
      - checkout
      - run:
          name: Install pnpm
          command: sudo npm install -g pnpm
      - run:
          name: Install dependencies
          command: pnpm install --frozen-lockfile
      - run:
          name: Deploy YouTube Worker to Cloudflare
          command: |
            if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
              echo "CLOUDFLARE_API_TOKEN not set — skipping Cloudflare deploy"
              exit 0
            fi
            ./node_modules/.bin/wrangler deploy src/youtube-worker.ts --name ytstudio

workflows:
  version: 2
  validate:
    jobs:
      - python-checks
      - node-checks
      - deploy-worker:
          requires:
            - node-checks
          filters:
            branches:
              only: main
