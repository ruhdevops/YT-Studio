version: 2.1

orbs:
  node: circleci/node@6

jobs:
  python-checks:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: Install Python tools
          command: |
            pip install --user ruff mypy pytest pytest-cov
            echo 'export PATH="$HOME/.local/bin:$PATH"' >> $BASH_ENV
      - run:
          name: Run Ruff linter and formatter
          command: |
            source $BASH_ENV
            ruff check . --fix || echo "Ruff check completed with warnings"
            ruff format .
      - run:
          name: Run MyPy type checker
          command: |
            source $BASH_ENV
            mypy . --ignore-missing-imports || echo "MyPy found issues but continuing"
      - run:
          name: Run pytest
          command: |
            source $BASH_ENV
            pytest || echo "No tests found"

  node-checks:
    docker:
      - image: cimg/node:22.19
    steps:
      - checkout
      - run:
          name: Install pnpm
          command: sudo npm install -g pnpm
      - run:
          name: Install root dependencies
          command: pnpm install --frozen-lockfile
      - run:
          name: Install functions dependencies
          command: |
            cd functions
            npm ci
      - run:
          name: Run ESLint on functions
          command: |
            cd functions
            npm run lint -- --max-warnings 0 || echo "Lint warnings found but continuing"
      - run:
          name: TypeScript type check on functions
          command: |
            cd functions
            npx tsc --noEmit

  worker-typecheck:
    docker:
      - image: cimg/node:22.19
    steps:
      - checkout
      - run:
          name: Install pnpm
          command: sudo npm install -g pnpm
      - run:
          name: Install root dependencies
          command: pnpm install --frozen-lockfile
      - run:
          name: TypeScript type check on worker
          command: pnpm run type-check || echo "Worker type check completed"

  worker-deploy:
    docker:
      - image: cimg/node:22.19
    steps:
      - checkout
      - run:
          name: Install pnpm
          command: sudo npm install -g pnpm
      - run:
          name: Install dependencies
          command: pnpm install --frozen-lockfile
      - run:
          name: Deploy YouTube API Worker to Cloudflare
          command: |
            pnpm run deploy:worker
          environment:
            CLOUDFLARE_API_TOKEN: $CLOUDFLARE_API_TOKEN

workflows:
  version: 2

  validate:
    jobs:
      - python-checks
      - node-checks
      - worker-typecheck

  deploy:
    jobs:
      - worker-deploy:
          filters:
            branches:
              only: main
