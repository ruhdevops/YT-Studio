version: 2.1

jobs:
  python-checks:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: Install Python tools
          command: |
            pip install --user ruff mypy pytest pytest-cov
            echo 'export PATH="$HOME/.local/bin:$PATH"' >> $BASH_ENV
      - run:
          name: Run Ruff linter and formatter
          command: |
            ruff check . --fix
            ruff format .
      - run:
          name: Run MyPy type checker
          command: mypy . || echo "MyPy found issues but continuing"
      - run:
          name: Run pytest
          command: pytest || echo "No tests found"

  node-checks:
    docker:
      - image: cimg/node:20.18
    steps:
      - checkout
      - run:
          name: Install root dependencies
          command: |
            sudo npm install -g pnpm
            pnpm install --frozen-lockfile
      - run:
          name: Install functions dependencies
          command: |
            npm --prefix functions install
      - run:
          name: Run linting
          command: |
            npm --prefix functions run lint -- --max-warnings 0
      - run:
          name: TypeScript type check
          command: |
            npm --prefix functions run build
      - run:
          name: Quality GC check
          command: npx quality-gc run || echo "Quality GC issues found"

  deploy-worker:
    docker:
      - image: cimg/node:20.18
    steps:
      - checkout
      - run:
          name: Install pnpm and dependencies
          command: |
            sudo npm install -g pnpm
            pnpm install --frozen-lockfile
      - run:
          name: Deploy YouTube API Worker to Cloudflare
          command: |
            pnpm wrangler deploy src/youtube-worker.ts --name ytstudio --compatibility-date 2025-01-01 --compatibility-flags nodejs_compat --env=""
          environment:
            CLOUDFLARE_API_TOKEN: $CLOUDFLARE_API_TOKEN

workflows:
  version: 2
  validate:
    jobs:
      - python-checks
      - node-checks
      - deploy-worker:
          requires:
            - node-checks
          filters:
            branches:
              only: main
