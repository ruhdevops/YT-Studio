version: 2.1

jobs:
  python-checks:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: Install Python tools
          command: |
            pip install --user ruff mypy pytest pytest-cov
            echo 'export PATH="$HOME/.local/bin:$PATH"' >> $BASH_ENV
      - run:
          name: Run Ruff linter and formatter
          command: |
            ruff check . --fix
            ruff format .
      - run:
          name: Run MyPy type checker
          command: mypy . || echo "MyPy found issues but continuing"
      - run:
          name: Run pytest
          command: pytest || echo "No tests found"

  node-checks:
    docker:
      - image: cimg/node:20.18
    steps:
      - checkout
      - run:
          name: Install root dependencies
          command: |
            sudo npm install -g pnpm
            pnpm install --frozen-lockfile
      - run:
          name: Install functions dependencies
          command: |
            cd functions
            npm ci
      - run:
          name: Run linting
          command: |
            cd functions
            npm run lint -- --max-warnings 0
      - run:
          name: TypeScript type check
          command: |
            cd functions
            npm run build
      - run:
          name: Quality GC check
          command: pnpm quality-gc run || echo "Quality GC issues found"

  deploy-worker:
    docker:
      - image: cimg/node:20.18
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: |
            sudo npm install -g pnpm
            pnpm install --frozen-lockfile
      - run:
          name: Deploy YouTube API v3 Worker to Cloudflare
          command: |
            if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
              echo "Deploying YouTube API v3 worker to Cloudflare..."
              pnpm wrangler deploy src/youtube-worker.ts \
                --name ytstudio \
                --env production \
                --compatibility-date 2025-01-01
            else
              echo "CLOUDFLARE_API_TOKEN not set — skipping worker deployment"
            fi
          environment:
            CLOUDFLARE_API_TOKEN: $CLOUDFLARE_API_TOKEN
            CLOUDFLARE_ACCOUNT_ID: $CLOUDFLARE_ACCOUNT_ID

workflows:
  version: 2
  validate:
    jobs:
      - python-checks
      - node-checks
      - deploy-worker:
          requires:
            - node-checks
          filters:
            branches:
              only: main
