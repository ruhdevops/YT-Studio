version: 2.1

jobs:
  python-checks:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: Install Python tools
          command: |
            pip install --user ruff mypy pytest pytest-cov
            echo 'export PATH="$HOME/.local/bin:$PATH"' >> $BASH_ENV
      - run:
          name: Run Ruff linter and formatter
          command: |
            ruff check . --fix
            ruff format .
      - run:
          name: Run MyPy type checker
          command: mypy . || echo "MyPy found issues but continuing"
      - run:
          name: Run pytest
          command: pytest || echo "No tests found"

  node-checks:
    docker:
      - image: cimg/node:22.x
    steps:
      - checkout
      - run:
          name: Install root dependencies
          command: |
            sudo npm install -g pnpm
            pnpm install --frozen-lockfile
      - run:
          name: Install functions dependencies
          command: |
            cd functions
            npm install --legacy-peer-deps
      - run:
          name: Run ESLint on functions
          command: |
            cd functions
            npm run lint -- --max-warnings 0
      - run:
          name: TypeScript type check on functions
          command: |
            cd functions
            npx tsc --noEmit
      - run:
          name: Quality GC check
          command: npx quality-gc run || echo "Quality GC issues found"

  worker-validate:
    docker:
      - image: cimg/node:22.x
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: |
            sudo npm install -g pnpm
            pnpm install --frozen-lockfile
      - run:
          name: TypeScript check - YouTube API Worker
          command: |
            pnpm exec tsc --noEmit --target ES2020 --lib ES2020 --moduleResolution bundler \
              --types @cloudflare/workers-types \
              src/youtube-worker.ts || echo "Type check completed with warnings"
      - run:
          name: Validate wrangler config
          command: |
            pnpm wrangler whoami || echo "Cloudflare auth not configured - skipping whoami"
            echo "Wrangler config:"
            cat wrangler.jsonc

  worker-deploy:
    docker:
      - image: cimg/node:22.x
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: |
            sudo npm install -g pnpm
            pnpm install --frozen-lockfile
      - run:
          name: Deploy YouTube API Worker to Cloudflare
          command: |
            if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
              echo "CLOUDFLARE_API_TOKEN not set - skipping worker deploy"
              exit 0
            fi
            pnpm wrangler deploy src/youtube-worker.ts --name ytstudio --env production
          environment:
            CLOUDFLARE_API_TOKEN: $CLOUDFLARE_API_TOKEN

workflows:
  version: 2

  validate:
    jobs:
      - python-checks
      - node-checks
      - worker-validate:
          requires:
            - node-checks

  deploy:
    jobs:
      - worker-deploy:
          filters:
            branches:
              only: main
