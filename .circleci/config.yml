version: 2.1

jobs:
  python-checks:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: Install Python tools
          command: |
            pip install --user ruff mypy pytest pytest-cov
            echo 'export PATH="$HOME/.local/bin:$PATH"' >> $BASH_ENV
      - run:
          name: Run Ruff linter
          command: ruff check . || echo "Ruff found issues"
      - run:
          name: Run Ruff formatter check
          command: ruff format --check . || echo "Ruff format issues found"
      - run:
          name: Run MyPy type checker
          command: mypy . || echo "MyPy found issues but continuing"
      - run:
          name: Run pytest
          command: pytest || echo "No tests found"

  node-checks:
    docker:
      - image: cimg/node:20.18
    steps:
      - checkout
      - run:
          name: Install root dependencies (pnpm)
          command: |
            sudo npm install -g pnpm
            pnpm install --frozen-lockfile
      - run:
          name: Install functions dependencies
          command: |
            cd functions
            npm install
      - run:
          name: Lint functions
          command: |
            cd functions
            npm run lint -- --max-warnings 0 || echo "Lint issues found in functions"
      - run:
          name: TypeScript check functions
          command: |
            cd functions
            npm run build || echo "TypeScript build issues in functions"
      - run:
          name: Quality GC check
          command: npx quality-gc run || echo "Quality GC issues found"

  worker-checks:
    docker:
      - image: cimg/node:20.18
    steps:
      - checkout
      - run:
          name: Install app worker dependencies
          command: |
            cd app
            npm install
      - run:
          name: TypeScript type check (app worker)
          command: |
            cd app
            npx tsc --noEmit
      - run:
          name: Run worker tests
          command: |
            cd app
            npm test -- --run || echo "Worker tests done"

  worker-deploy:
    docker:
      - image: cimg/node:20.18
    steps:
      - checkout
      - run:
          name: Install root dependencies
          command: |
            sudo npm install -g pnpm
            pnpm install --frozen-lockfile
      - run:
          name: Deploy YouTube worker to Cloudflare
          command: |
            if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
              echo "CLOUDFLARE_API_TOKEN not set — skipping deploy"
            else
              pnpm run deploy:worker
            fi

workflows:
  version: 2
  validate:
    jobs:
      - python-checks
      - node-checks
      - worker-checks
      - worker-deploy:
          requires:
            - node-checks
            - worker-checks
          filters:
            branches:
              only: main
