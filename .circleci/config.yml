version: 2.1

jobs:
  python-checks:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: Install Python tools
          command: |
            pip install --user ruff mypy pytest pytest-cov
            echo 'export PATH="$HOME/.local/bin:$PATH"' >> $BASH_ENV
      - run:
          name: Run Ruff linter and formatter
          command: |
            ruff check .
            ruff format --check .
      - run:
          name: Run MyPy type checker
          command: mypy . --ignore-missing-imports || echo "MyPy found issues but continuing"
      - run:
          name: Run pytest
          command: pytest || echo "No tests found"

  node-checks:
    docker:
      - image: cimg/node:20.18
    steps:
      - checkout
      - run:
          name: Install pnpm and root dependencies
          command: |
            sudo npm install -g pnpm
            pnpm install --frozen-lockfile
      - run:
          name: Install functions dependencies
          command: |
            cd functions
            npm install
      - run:
          name: Run ESLint
          command: |
            cd functions
            npm run lint -- --max-warnings 0
      - run:
          name: TypeScript type check (functions)
          command: |
            cd functions
            ./node_modules/.bin/tsc --noEmit

  youtube-worker:
    docker:
      - image: cimg/node:20.18
    steps:
      - checkout
      - run:
          name: Install pnpm and root dependencies
          command: |
            sudo npm install -g pnpm
            pnpm install --frozen-lockfile
      - run:
          name: Install Wrangler
          command: sudo npm install -g wrangler
      - run:
          name: Validate YouTube worker TypeScript
          command: |
            echo "--- Validating src/youtube-worker.ts ---"
            # Verify TypeScript compiles without errors using wrangler's bundler
            wrangler deploy src/youtube-worker.ts --name ytstudio --dry-run --outdir /tmp/worker-build
            echo "Worker build validated successfully"
      - run:
          name: Deploy Cloudflare Worker
          command: |
            if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
              echo "Deploying YouTube worker to Cloudflare..."
              wrangler deploy src/youtube-worker.ts --name ytstudio
              echo "Deployment complete"
            else
              echo "CLOUDFLARE_API_TOKEN not set — skipping live deploy (dry-run only)"
            fi
      - run:
          name: Run YouTube integration check
          command: |
            pip install --user google-auth requests 2>/dev/null || true
            python3 .github/scripts/youtube_integration.py
            cat /tmp/youtube_result.md || echo "No result file generated"

workflows:
  version: 2
  validate:
    jobs:
      - python-checks
      - node-checks
      - youtube-worker:
          requires:
            - node-checks
