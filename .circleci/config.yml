version: 2.1

jobs:
  python-checks:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: Install Python tools
          command: |
            pip install --user ruff mypy pytest pytest-cov
            echo 'export PATH="$HOME/.local/bin:$PATH"' >> $BASH_ENV
      - run:
          name: Run Ruff linter and formatter
          command: |
            ruff check . --fix
            ruff format .
      - run:
          name: Run MyPy type checker
          command: mypy . || echo "MyPy found issues but continuing"
      - run:
          name: Run pytest
          command: pytest || echo "No tests found"

  node-checks:
    docker:
      - image: cimg/node:22.18
    steps:
      - checkout
      - run:
          name: Install pnpm
          command: sudo npm install -g pnpm
      - run:
          name: Install root dependencies
          command: pnpm install --frozen-lockfile
      - run:
          name: Install functions dependencies
          command: |
            cd functions
            npm install --legacy-peer-deps
      - run:
          name: Run ESLint on functions
          command: |
            cd functions
            npm run lint -- --max-warnings 0
      - run:
          name: TypeScript type check for functions
          command: |
            cd functions
            npm run typecheck
      - run:
          name: Build functions
          command: |
            cd functions
            npm run build
      - run:
          name: TypeScript type check for Cloudflare Workers
          command: |
            ./node_modules/.bin/tsc --noEmit --project tsconfig.json || echo "Worker type check issues found"

  worker-tests:
    docker:
      - image: cimg/node:22.18
    steps:
      - checkout
      - run:
          name: Install pnpm
          command: sudo npm install -g pnpm
      - run:
          name: Install root dependencies
          command: pnpm install --frozen-lockfile
      - run:
          name: Install app worker dependencies
          command: |
            cd app
            npm install
      - run:
          name: Run app worker tests
          command: |
            cd app
            npm test -- --run

workflows:
  version: 2
  validate:
    jobs:
      - python-checks
      - node-checks
      - worker-tests
