version: 2.1

jobs:
  python-checks:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: Install Python tools
          command: |
            pip install --user ruff mypy pytest pytest-cov
            echo 'export PATH="$HOME/.local/bin:$PATH"' >> $BASH_ENV
      - run:
          name: Run Ruff linter and formatter
          command: |
            ruff check . --fix
            ruff format .
      - run:
          name: Run MyPy type checker
          command: mypy . || echo "MyPy found issues but continuing"
      - run:
          name: Run pytest
          command: pytest || echo "No tests found"

  node-checks:
    docker:
      - image: cimg/node:20.18
    steps:
      - checkout
      - run:
          name: Install root dependencies
          command: |
            sudo npm install -g pnpm
            pnpm install --frozen-lockfile
      - run:
          name: Install functions dependencies
          command: |
            cd functions && npm install --legacy-peer-deps
      - run:
          name: Run functions linting
          command: |
            cd functions && npm run lint || echo "Lint warnings found"
      - run:
          name: TypeScript type check (functions)
          command: |
            cd functions && pnpm exec tsc --noEmit || echo "Type errors found but continuing"
      - run:
          name: TypeScript type check (root worker)
          command: pnpm type-check || echo "Root type errors found but continuing"

  worker-deploy:
    docker:
      - image: cimg/node:20.18
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: |
            sudo npm install -g pnpm wrangler
            pnpm install --frozen-lockfile
      - run:
          name: Verify YouTube Worker TypeScript
          command: pnpm type-check
      - run:
          name: Deploy YouTube API Worker to Cloudflare
          command: |
            wrangler deploy src/youtube-worker.ts --name ytstudio
          environment:
            CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN}
            CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID}

workflows:
  version: 2
  validate:
    jobs:
      - python-checks
      - node-checks

  deploy:
    jobs:
      - worker-deploy:
          filters:
            branches:
              only: main
          context:
            - cloudflare
