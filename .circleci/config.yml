version: 2.1

jobs:
  python-checks:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: Install Python tools
          command: |
            pip install --user ruff mypy pytest pytest-cov
            echo 'export PATH="$HOME/.local/bin:$PATH"' >> $BASH_ENV
      - run:
          name: Run Ruff linter and formatter
          command: |
            ruff check . --fix || echo "Ruff check completed with warnings"
            ruff format .
      - run:
          name: Run MyPy type checker
          command: mypy . || echo "MyPy found issues but continuing"
      - run:
          name: Run pytest
          command: pytest || echo "No tests found"

  node-checks:
    docker:
      - image: cimg/node:20.18
    steps:
      - checkout
      - run:
          name: Install root dependencies
          command: |
            sudo npm install -g pnpm
            pnpm install --frozen-lockfile
      - run:
          name: Install Firebase Functions dependencies
          command: |
            cd functions
            npm install
      - run:
          name: Run ESLint on Firebase Functions
          command: |
            cd functions
            npm run lint -- --max-warnings 0 || echo "ESLint found warnings"
      - run:
          name: TypeScript type check on Firebase Functions
          command: |
            cd functions
            npx tsc --noEmit || echo "TypeScript issues found in functions"
      - run:
          name: Quality GC check
          command: npx quality-gc run || echo "Quality GC issues found"

  worker-build:
    docker:
      - image: cimg/node:20.18
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: |
            sudo npm install -g pnpm
            pnpm install --frozen-lockfile
      - run:
          name: TypeScript type check on Cloudflare Worker
          command: pnpm run type-check
      - run:
          name: Deploy YouTube API worker to Cloudflare
          command: |
            if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
              echo "Deploying ytstudio worker to Cloudflare..."
              pnpm exec wrangler deploy src/youtube-worker.ts --name ytstudio
            else
              echo "CLOUDFLARE_API_TOKEN not set — skipping worker deploy"
            fi

workflows:
  version: 2
  validate:
    jobs:
      - python-checks
      - node-checks
      - worker-build
