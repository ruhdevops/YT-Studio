version: 2.1

jobs:
  python-checks:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: Install Python tools
          command: |
            pip install --user ruff mypy pytest pytest-cov
            echo 'export PATH="$HOME/.local/bin:$PATH"' >> $BASH_ENV
      - run:
          name: Run Ruff linter and formatter
          command: |
            ruff check . --fix
            ruff format .
      - run:
          name: Run MyPy type checker
          command: mypy . || echo "MyPy found issues but continuing"
      - run:
          name: Run pytest
          command: pytest || echo "No tests found"

  node-checks:
    docker:
      - image: cimg/node:22.11
    steps:
      - checkout
      - run:
          name: Install root dependencies
          command: |
            sudo npm install -g pnpm
            pnpm install --frozen-lockfile
      - run:
          name: Install functions dependencies
          command: |
            cd functions
            npm install
      - run:
          name: Run linting
          command: |
            cd functions
            npm run lint -- --max-warnings 10
      - run:
          name: TypeScript type check (functions)
          command: |
            cd functions
            npm run build
      - run:
          name: Quality GC check
          command: npx quality-gc run || echo "Quality GC issues found"

  worker-build:
    docker:
      - image: cimg/node:22.11
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: |
            sudo npm install -g pnpm
            pnpm install --frozen-lockfile
      - run:
          name: TypeScript type check for workers
          command: pnpm run type-check
      - run:
          name: Deploy YouTube worker to Cloudflare
          command: |
            if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
              pnpm exec wrangler deploy src/youtube-worker.ts --name ytstudio --env=""
            else
              echo "CLOUDFLARE_API_TOKEN not set — skipping deploy (dry-run validation only)"
              pnpm exec wrangler deploy src/youtube-worker.ts --name ytstudio --env="" --dry-run 2>&1 || true
            fi

workflows:
  version: 2
  validate:
    jobs:
      - python-checks
      - node-checks
      - worker-build
