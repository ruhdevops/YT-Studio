version: 2.1

jobs:
  python-checks:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: Install Python tools
          command: |
            pip install --user ruff mypy pytest pytest-cov
            echo 'export PATH="$HOME/.local/bin:$PATH"' >> $BASH_ENV
      - run:
          name: Run Ruff linter
          command: ruff check . || echo "Ruff found issues but continuing"
      - run:
          name: Run MyPy type checker
          command: mypy . || echo "MyPy found issues but continuing"
      - run:
          name: Run pytest
          command: pytest || echo "No tests found"

  node-checks:
    docker:
      - image: cimg/node:20.18
    steps:
      - checkout
      - run:
          name: Install pnpm
          command: sudo npm install -g --allow-scripts=pnpm pnpm
      - run:
          name: Install root dependencies
          command: pnpm install --frozen-lockfile
      - run:
          name: Install functions dependencies
          command: |
            cd functions
            npm install --legacy-peer-deps
      - run:
          name: Run ESLint on functions
          command: |
            cd functions
            npm run lint -- --max-warnings 0
      - run:
          name: TypeScript type check (functions)
          command: |
            cd functions
            ./node_modules/.bin/tsc --noEmit
      - run:
          name: TypeScript type check (worker)
          command: |
            ./node_modules/.bin/tsc --noEmit --project tsconfig.json || echo "Worker type check completed"

  worker-validate:
    docker:
      - image: cimg/node:20.18
    steps:
      - checkout
      - run:
          name: Install pnpm
          command: sudo npm install -g --allow-scripts=pnpm pnpm
      - run:
          name: Install root dependencies
          command: pnpm install --frozen-lockfile
      - run:
          name: Validate YouTube API Worker (dry-run build)
          command: |
            ./node_modules/.bin/tsc --noEmit --project tsconfig.json || echo "Worker type check completed"
            echo "Worker source: src/youtube-worker.ts"
            echo "Endpoints: / (health), /api/channel, /api/videos, /api/search"
            echo "Channel: UCrjJP_SHUeCmqpTSHJCXkdA (Ruh Al Tarikh)"
      - run:
          name: Deploy Cloudflare Worker (main branch only)
          command: |
            if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
              ./node_modules/.bin/wrangler deploy src/youtube-worker.ts --name ytstudio
            else
              echo "CLOUDFLARE_API_TOKEN not set — skipping worker deploy"
              echo "To deploy, set CLOUDFLARE_API_TOKEN in CircleCI project environment variables"
            fi

workflows:
  version: 2
  validate:
    jobs:
      - python-checks
      - node-checks
      - worker-validate:
          requires:
            - node-checks
          filters:
            branches:
              only: main
