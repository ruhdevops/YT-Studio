version: 2.1

jobs:
  python-checks:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: Install Python tools
          command: |
            pip install --user ruff mypy pytest pytest-cov
            echo 'export PATH="$HOME/.local/bin:$PATH"' >> $BASH_ENV
      - run:
          name: Run Ruff linter and formatter
          command: |
            ruff check . --fix || echo "Ruff issues found but continuing"
            ruff format . || echo "Ruff format issues found but continuing"
      - run:
          name: Run MyPy type checker
          command: mypy . || echo "MyPy found issues but continuing"
      - run:
          name: Run pytest
          command: pytest || echo "No tests found"

  node-checks:
    docker:
      - image: cimg/node:20.18
    steps:
      - checkout
      - run:
          name: Install root dependencies
          command: |
            sudo npm install -g pnpm
            pnpm install --frozen-lockfile
      - run:
          name: Install functions dependencies
          command: |
            cd functions
            npm install --legacy-peer-deps
      - run:
          name: Run functions linting
          command: |
            cd functions
            npm run lint -- --max-warnings 0 || echo "Lint warnings found but continuing"
      - run:
          name: TypeScript type check (functions)
          command: |
            cd functions
            npx tsc --noEmit || echo "TypeScript issues found but continuing"
      - run:
          name: TypeScript type check (worker)
          command: pnpm run type-check || echo "Worker TypeScript issues found but continuing"

  worker-typecheck:
    docker:
      - image: cimg/node:20.18
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: |
            sudo npm install -g pnpm
            pnpm install --frozen-lockfile
      - run:
          name: Validate YouTube worker TypeScript
          command: pnpm run type-check

workflows:
  version: 2
  validate:
    jobs:
      - python-checks
      - node-checks
      - worker-typecheck
