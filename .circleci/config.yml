version: 2.1

jobs:
  python-checks:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: Install Python tools
          command: |
            pip install --user ruff mypy pytest pytest-cov
            echo 'export PATH="$HOME/.local/bin:$PATH"' >> $BASH_ENV
      - run:
          name: Run Ruff linter and formatter
          command: |
            ruff check . --fix
            ruff format .
      - run:
          name: Run MyPy type checker
          command: mypy . || echo "MyPy found issues but continuing"
      - run:
          name: Run pytest
          command: pytest || echo "No tests found"

  node-checks:
    docker:
      - image: cimg/node:20.18
    steps:
      - checkout
      - run:
          name: Install functions dependencies
          command: |
            cd functions
            npm install
      - run:
          name: ESLint check (functions)
          command: |
            cd functions
            npm run lint -- --max-warnings 0
      - run:
          name: TypeScript type check (functions)
          command: |
            cd functions
            ./node_modules/.bin/tsc --noEmit

  worker-checks:
    docker:
      - image: cimg/node:20.18
    steps:
      - checkout
      - run:
          name: Install worker dependencies
          command: |
            cd app
            npm install
      - run:
          name: Run Cloudflare Worker tests
          command: |
            cd app
            npm test

  worker-deploy:
    docker:
      - image: cimg/node:20.18
    steps:
      - checkout
      - run:
          name: Install worker dependencies
          command: |
            cd app
            npm install
      - run:
          name: Deploy Cloudflare Worker (ytstudio)
          command: |
            if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
              echo "CLOUDFLARE_API_TOKEN not configured — skipping deploy"
              exit 0
            fi
            cd app
            npm run deploy

workflows:
  version: 2
  validate:
    jobs:
      - python-checks
      - node-checks
      - worker-checks
      - worker-deploy:
          requires:
            - worker-checks
          filters:
            branches:
              only: main
