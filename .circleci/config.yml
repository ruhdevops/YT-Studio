version: 2.1

jobs:
  python-checks:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: Install Python tools
          command: |
            pip install --user ruff mypy pytest pytest-cov
            echo 'export PATH="$HOME/.local/bin:$PATH"' >> $BASH_ENV
      - run:
          name: Run Ruff linter and formatter
          command: |
            ruff check . --fix
            ruff format .
      - run:
          name: Run MyPy type checker
          command: mypy . || echo "MyPy found issues but continuing"
      - run:
          name: Run pytest
          command: pytest || echo "No tests found"

  node-checks:
    docker:
      - image: cimg/node:20.18
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: |
            sudo npm install -g pnpm
            pnpm install --frozen-lockfile
      - run:
          name: Install functions dependencies
          command: |
            cd functions
            npm install --legacy-peer-deps
      - run:
          name: Run functions linting
          command: |
            cd functions
            npm run lint -- --max-warnings 0
      - run:
          name: TypeScript type check (functions)
          command: |
            cd functions
            ./node_modules/.bin/tsc --noEmit
      - run:
          name: TypeScript type check (YouTube worker)
          command: ./node_modules/.bin/tsc --noEmit --project tsconfig.json || echo "Worker type check issues found (non-blocking)"

  worker-check:
    docker:
      - image: cimg/node:22.11
    steps:
      - checkout
      - run:
          name: Install pnpm and root dependencies
          command: |
            sudo npm install -g pnpm
            pnpm install --frozen-lockfile
      - run:
          name: Install yt-proxy dependencies
          command: |
            cd yt-proxy
            pnpm install --frozen-lockfile
      - run:
          name: Validate YouTube worker TypeScript
          command: |
            ./node_modules/.bin/tsc --noEmit --project tsconfig.json
      - run:
          name: Wrangler config validation
          command: |
            cd yt-proxy
            ./node_modules/.bin/wrangler deploy --dry-run src/youtube-worker.ts --name ytstudio 2>/dev/null || \
            ../node_modules/.bin/wrangler deploy --dry-run ../src/youtube-worker.ts --name ytstudio 2>/dev/null || \
            echo "Wrangler dry-run skipped (requires auth)"

  worker-deploy:
    docker:
      - image: cimg/node:22.11
    steps:
      - checkout
      - run:
          name: Install pnpm and dependencies
          command: |
            sudo npm install -g pnpm
            pnpm install --frozen-lockfile
      - run:
          name: Deploy YouTube API Worker to Cloudflare
          command: |
            ./node_modules/.bin/wrangler deploy src/youtube-worker.ts --name ytstudio
          environment:
            CLOUDFLARE_API_TOKEN: $CLOUDFLARE_API_TOKEN
            CLOUDFLARE_ACCOUNT_ID: $CLOUDFLARE_ACCOUNT_ID

workflows:
  version: 2
  validate:
    jobs:
      - python-checks
      - node-checks
      - worker-check

  deploy-worker:
    jobs:
      - worker-deploy:
          filters:
            branches:
              only: main
          context:
            - cloudflare
