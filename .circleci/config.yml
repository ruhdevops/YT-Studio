version: 2.1

jobs:
  python-checks:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: Install Python tools
          command: |
            pip install --user ruff mypy pytest pytest-cov
            echo 'export PATH="$HOME/.local/bin:$PATH"' >> $BASH_ENV
      - run:
          name: Run Ruff linter
          command: ruff check . --fix || echo "Ruff found unfixable issues but continuing"
      - run:
          name: Run Ruff formatter
          command: ruff format . || echo "Ruff format issues found"
      - run:
          name: Run MyPy type checker
          command: mypy . || echo "MyPy found issues but continuing"
      - run:
          name: Run pytest
          command: pytest || echo "No tests found or tests failed"

  node-checks:
    docker:
      - image: cimg/node:20.18
    steps:
      - checkout
      - run:
          name: Install root dependencies
          command: |
            sudo npm install -g pnpm
            pnpm install --frozen-lockfile
      - run:
          name: Patch and install functions dependencies
          command: |
            cd functions
            node -e "
              const fs = require('fs');
              const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
              if (pkg.devDependencies && pkg.devDependencies.typescript) {
                pkg.devDependencies.typescript = '^5.5.2';
              }
              fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
            "
            npm install
      - run:
          name: Run ESLint on functions
          command: |
            cd functions
            npm run lint -- --max-warnings 0 || echo "ESLint warnings found, continuing"
      - run:
          name: TypeScript type check (functions)
          command: |
            cd functions
            npx tsc --noEmit || echo "TypeScript issues found in functions, continuing"
      - run:
          name: Quality GC check
          command: npx quality-gc run || echo "Quality GC issues found"

  worker-checks:
    docker:
      - image: cimg/node:20.18
    steps:
      - checkout
      - run:
          name: Install app worker dependencies
          command: |
            cd app
            npm install
      - run:
          name: TypeScript type check (app worker)
          command: |
            cd app
            npx tsc --noEmit
      - run:
          name: Run app worker tests
          command: |
            cd app
            npm test -- --run
      - run:
          name: Validate root worker TypeScript
          command: |
            sudo npm install -g pnpm
            pnpm install --frozen-lockfile
            npx tsc --noEmit -p tsconfig.json || echo "Root worker TypeScript issues found, continuing"

workflows:
  version: 2
  validate:
    jobs:
      - python-checks
      - node-checks
      - worker-checks
