version: 2.1

jobs:
  python-checks:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: Install Python tools
          command: |
            pip install --user ruff mypy pytest pytest-cov
            echo 'export PATH="$HOME/.local/bin:$PATH"' >> $BASH_ENV
      - run:
          name: Run Ruff linter and formatter
          command: |
            ruff check . --fix
            ruff format .
      - run:
          name: Run MyPy type checker
          command: mypy . || echo "MyPy found issues but continuing"
      - run:
          name: Run pytest
          command: pytest || echo "No tests found"

  node-checks:
    docker:
      - image: cimg/node:22.19
    steps:
      - checkout
      - run:
          name: Install root dependencies
          command: |
            sudo npm install -g pnpm
            pnpm install --frozen-lockfile
      - run:
          name: Install Firebase Functions dependencies
          command: |
            cd functions
            npm install
      - run:
          name: Run ESLint on Firebase Functions
          command: |
            cd functions
            npm run lint -- --max-warnings 0
      - run:
          name: TypeScript type check on Firebase Functions
          command: |
            cd functions
            ./node_modules/.bin/tsc --noEmit
      - run:
          name: Quality GC check
          command: npx quality-gc run || echo "Quality GC issues found"

  worker-test:
    docker:
      - image: cimg/node:22.19
    steps:
      - checkout
      - run:
          name: Install Cloudflare Worker dependencies
          command: |
            cd app
            npm install
      - run:
          name: Run Cloudflare Worker tests (Vitest)
          command: |
            cd app
            npm test -- --run

  worker-deploy:
    docker:
      - image: cimg/node:22.19
    steps:
      - checkout
      - run:
          name: Install Cloudflare Worker dependencies
          command: |
            cd app
            npm install
      - run:
          name: Deploy ytstudio Cloudflare Worker
          command: |
            cd app
            npm run deploy
          environment:
            CLOUDFLARE_API_TOKEN: $CLOUDFLARE_API_TOKEN
            CLOUDFLARE_ACCOUNT_ID: $CLOUDFLARE_ACCOUNT_ID

workflows:
  version: 2

  validate:
    jobs:
      - python-checks
      - node-checks
      - worker-test

  deploy:
    jobs:
      - worker-test:
          filters:
            branches:
              only: main
      - worker-deploy:
          requires:
            - worker-test
          filters:
            branches:
              only: main
