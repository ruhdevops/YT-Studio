version: 2.1

jobs:
  python-checks:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: Install Python tools
          command: |
            pip install --user ruff mypy pytest pytest-cov
            echo 'export PATH="$HOME/.local/bin:$PATH"' >> $BASH_ENV
      - run:
          name: Run Ruff linter and formatter
          command: |
            ruff check . --fix
            ruff format .
      - run:
          name: Run MyPy type checker
          command: mypy . || echo "MyPy found issues but continuing"
      - run:
          name: Run pytest
          command: pytest || echo "No tests found"

  node-checks:
    docker:
      - image: cimg/node:22.19
    steps:
      - checkout
      - run:
          name: Install pnpm
          command: sudo npm install -g pnpm
      - run:
          name: Install root dependencies
          command: pnpm install --frozen-lockfile --ignore-scripts
      - run:
          name: Install functions dependencies
          command: cd functions && npm install
      - run:
          name: ESLint check (functions)
          command: cd functions && npm run lint -- --max-warnings 0
      - run:
          name: TypeScript type check (functions)
          command: cd functions && ./node_modules/.bin/tsc --noEmit

  worker-checks:
    docker:
      - image: cimg/node:22.19
    steps:
      - checkout
      - run:
          name: Install pnpm
          command: sudo npm install -g pnpm
      - run:
          name: Install app worker dependencies
          command: cd app && pnpm install --frozen-lockfile
      - run:
          name: TypeScript type check (app worker)
          command: cd app && ./node_modules/.bin/tsc --noEmit
      - run:
          name: Run worker unit tests
          command: cd app && pnpm test run

  deploy-worker:
    docker:
      - image: cimg/node:22.19
    steps:
      - checkout
      - run:
          name: Install pnpm
          command: sudo npm install -g pnpm
      - run:
          name: Install root dependencies
          command: pnpm install --frozen-lockfile --ignore-scripts
      - run:
          name: Deploy ytstudio Cloudflare Worker
          command: |
            if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
              echo "CLOUDFLARE_API_TOKEN not set — skipping worker deploy"
              exit 0
            fi
            ./node_modules/.bin/wrangler deploy src/youtube-worker.ts --name ytstudio
          environment:
            CLOUDFLARE_API_TOKEN: $CLOUDFLARE_API_TOKEN

workflows:
  version: 2
  validate:
    jobs:
      - python-checks
      - node-checks
      - worker-checks
      - deploy-worker:
          requires:
            - node-checks
            - worker-checks
          filters:
            branches:
              only: main
