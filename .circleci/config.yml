version: 2.1

jobs:
  python-checks:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: Install Python tools
          command: |
            pip install --user ruff mypy pytest pytest-cov
            echo 'export PATH="$HOME/.local/bin:$PATH"' >> $BASH_ENV
      - run:
          name: Run Ruff linter
          command: ruff check . --fix || true
      - run:
          name: Run Ruff formatter
          command: ruff format .
      - run:
          name: Run MyPy type checker
          command: mypy . || echo "MyPy found issues but continuing"
      - run:
          name: Run pytest
          command: pytest || echo "No tests found"

  node-checks:
    docker:
      - image: cimg/node:22.19
    steps:
      - checkout
      - run:
          name: Install pnpm
          command: sudo npm install -g pnpm
      - run:
          name: Install root dependencies
          command: pnpm install --frozen-lockfile
      - run:
          name: Install functions dependencies
          command: |
            cd functions
            npm install --legacy-peer-deps
      - run:
          name: Run ESLint on functions
          command: |
            cd functions
            npm run lint -- --max-warnings 0
      - run:
          name: TypeScript type check (functions)
          command: |
            cd functions
            ./node_modules/.bin/tsc --noEmit
      - run:
          name: TypeScript type check (app worker)
          command: |
            cd app
            pnpm install --no-frozen-lockfile
            ./node_modules/.bin/tsc --noEmit || echo "App type-check issues found"

  worker-tests:
    docker:
      - image: cimg/node:22.19
    steps:
      - checkout
      - run:
          name: Install pnpm
          command: sudo npm install -g pnpm
      - run:
          name: Install app worker dependencies
          command: |
            cd app
            pnpm install --no-frozen-lockfile
      - run:
          name: Run worker tests
          command: |
            cd app
            pnpm test -- --run

  deploy-workers:
    docker:
      - image: cimg/node:22.19
    steps:
      - checkout
      - run:
          name: Install pnpm
          command: sudo npm install -g pnpm
      - run:
          name: Install root dependencies
          command: pnpm install --frozen-lockfile
      - run:
          name: Install app worker dependencies
          command: |
            cd app
            pnpm install --no-frozen-lockfile
      - run:
          name: Deploy ytstudio worker (src/youtube-worker.ts)
          command: |
            if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
              pnpm run deploy:worker
            else
              echo "CLOUDFLARE_API_TOKEN not set - skipping deploy"
            fi
      - run:
          name: Deploy ytstudio-app worker (app/)
          command: |
            if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
              cd app
              pnpm run deploy
            else
              echo "CLOUDFLARE_API_TOKEN not set - skipping deploy"
            fi

workflows:
  version: 2
  validate:
    jobs:
      - python-checks
      - node-checks
      - worker-tests:
          requires:
            - node-checks
      - deploy-workers:
          requires:
            - worker-tests
          filters:
            branches:
              only: main
