version: 2.1

jobs:
  python-checks:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: Install Python tools
          command: |
            pip install --user ruff mypy pytest pytest-cov
            echo 'export PATH="$HOME/.local/bin:$PATH"' >> $BASH_ENV
      - run:
          name: Run Ruff linter and formatter
          command: |
            ruff check . --fix
            ruff format .
      - run:
          name: Run MyPy type checker
          command: mypy . || echo "MyPy found issues but continuing"
      - run:
          name: Run pytest
          command: pytest || echo "No tests found"

  node-checks:
    docker:
      - image: cimg/node:20.18
    steps:
      - checkout
      - run:
          name: Install pnpm
          command: sudo npm install -g pnpm
      - run:
          name: Install root dependencies
          command: pnpm install --frozen-lockfile
      - run:
          name: Install functions dependencies
          command: |
            cd functions
            npm install --legacy-peer-deps 2>&1 || echo "functions install had issues, skipping lint"
      - run:
          name: Run ESLint on functions
          command: |
            if [ -d functions/node_modules ]; then
              cd functions && npm run lint -- --max-warnings 0
            else
              echo "Skipping functions ESLint (node_modules not available)"
            fi
      - run:
          name: TypeScript type check (functions)
          command: |
            if [ -d functions/node_modules ]; then
              cd functions && npx tsc --noEmit
            else
              echo "Skipping functions TypeScript check (node_modules not available)"
            fi
      - run:
          name: Quality GC check
          command: npx quality-gc run || echo "Quality GC issues found"

  worker-build:
    docker:
      - image: cimg/node:22.14
    steps:
      - checkout
      - run:
          name: Install pnpm
          command: sudo npm install -g pnpm
      - run:
          name: Install root dependencies
          command: pnpm install --frozen-lockfile
      - run:
          name: TypeScript type check (src/youtube-worker.ts + src/worker.ts)
          command: npx tsc --noEmit
      - run:
          name: Install app worker dependencies
          command: |
            cd app
            npm install --legacy-peer-deps 2>&1 || echo "app install had issues"
      - run:
          name: TypeScript type check (app worker)
          command: |
            if [ -d app/node_modules ]; then
              cd app && npx tsc --noEmit
            else
              echo "Skipping app TypeScript check (node_modules not available)"
            fi

workflows:
  version: 2
  validate:
    jobs:
      - python-checks
      - node-checks
      - worker-build
